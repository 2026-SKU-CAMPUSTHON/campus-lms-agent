{
  "openapi": "3.0.3",
  "info": {
    "title": "Campus LMS Agent API",
    "version": "0.10.0-student-report.1",
    "description": "로컬 퀴즈 및 Q&A 구현 계약. x-implementation-status=implemented는 제공하는 API, planned는 후속 작업이다. Q&A는 주차 자료 검색 후 Jev 판단, Claude API 또는 명시적으로 선택한 Codex 문장 생성, 추가 질문 1회와 교수 승격을 수행한다. 실제 Jev 키 없는 경우 오류·재시도로 남기며 다른 모델 판단으로 자동 대체하지 않는다. Supabase 배포는 미구현이다. 교수 레포트는 현재 수강생 기준 퀴즈 집계와 선택 주차 전체 Q&A 상태·대화 페이지를 제공한다. 녹음·동영상은 로컬 faster-whisper로 전사하고 같은 주차 Q&A에 시간 출처로 사용한다. YouTube 공개 영상은 자막 우선·음성 전사 대체로 선택 시간 구간을 같은 주차 Q&A에 사용한다. 원본 시각을 보존하고 앱에서의 원본/전사 공개 여부를 검사한다. 완료된 YouTube의 등록 시간 구간으로 퀴즈를 생성하고, 서버가 근거 ID를 원본 시간 출처로 연결한다. 교수 선택 게시·학생 제출/오답과 문항별 레포트에 같은 출처를 보존한다. 교수는 미게시 초안의 문제/보기/정답/풀이를 직접 수정하고 버전을 확인하여 저장·게시할 수 있다. 게시 후 수정은 거부한다. 교수의 선택 주차 전체 퀴즈/Q&A PDF 다운로드를 제공한다. 기존 집계/권한과 Worker 계약은 유지한다. 학생 본인의 제출 결과만 사용하는 주차별 오답 레포트 조회/PDF 다운로드를 제공한다."
  },
