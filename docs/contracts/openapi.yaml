      "post": {
        "operationId": "generateQuizDraft",
        "description": "교수 전용. 처리 완료된 PDF/PPTX 한 개의 등록 페이지 범위 또는 완료된 YouTube 한 개의 등록 시간 구간으로 1~50문항을 최대 8개씩 배치 생성한다. 기본 Claude API, YouTube는 Claude/명시적 Codex 제공자만 지원한다. 전사 전체 근거를 입력 그룹으로 나누며 Q&A 검색 상위 일부만으로 출제하지 않는다. 서버가 근거 ID·문항 수·보기·중복을 검사하고 원본 시간 출처를 붙인다. 근거가 불명확하면 INSUFFICIENT_QUIZ_EVIDENCE로 실패하며 부분 초안을 저장하지 않는다. 완료 Job.result.draft_id로 검토 후 선택 게시한다. 같은 강의에 진행 작업이 있으면 409다.",
        "responses": {
          "202": {
            "description": "성공",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Job"
                }
