              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/courses/{course_id}/weeks/{week_id}/threads": {
      "post": {
        "operationId": "createThread",
        "description": "로그인 학생의 질문 스레드를 만들고 처리를 큐에 넣는다. GET으로 결과를 조회한다.",
        "responses": {
          "201": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Thread"
                }
              }
            }
          },
          "default": {
            "description": "권한 오류·계약 오류·처리 오류",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "course_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "week_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "text": {
                    "type": "string",
                    "minLength": 1
                  }
                },
                "required": [
                  "text"
                ],
                "additionalProperties": false
              }
            }
          }
        }
      }
    },
    "/threads/{thread_id}": {
      "get": {
        "operationId": "getThread",
        "description": "질문 소유자 또는 해당 강의 교수만 조회한다.",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Thread"
                }
              }
            }
          },
          "default": {
            "description": "권한 오류·계약 오류·처리 오류",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "thread_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ]
      }
    },
    "/threads/{thread_id}/messages": {
      "post": {
        "operationId": "replyToThread",
        "description": "작성자 역할은 서버가 결정한다. awaiting_student의 학생 보완 답변은 재검색·재판단한다. awaiting_professor의 교수 답변은 resolved로 전환한다. 상태·버전 충돌은 409, 잘못된 상태 제출은 422다. 명확하지만 근거 부족이면 교수에게 승격한다. 추가 질문 최대 1회는 트랜잭션으로 보장한다.",
        "responses": {
          "202": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Thread"
                }
              }
            }
          },
          "default": {
            "description": "권한 오류·계약 오류·처리 오류",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "thread_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "text": {
                    "type": "string",
                    "minLength": 1
                  }
                },
                "required": [
                  "text"
                ],
                "additionalProperties": false
              }
            }
          }
        }
      }
    },
    "/courses/{course_id}/reports/quizzes": {
      "get": {
        "operationId": "getQuizReport",
        "description": "교수 전용. 선택 주차 또는 전체 주차. 대상자/재응시 정의는 draft-1에서 미확정이며 첫 계약에서 결정한다. 분모 0이면 비율 null.",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/QuizReport"
                }
              }
            }
          },
          "default": {
            "description": "권한 오류·계약 오류·처리 오류",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "course_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "week_ids",
            "in": "query",
            "required": false,
            "style": "form",
            "explode": false,
            "schema": {
              "type": "array",
              "items": {
                "type": "string",
                "format": "uuid"
              }
            },
            "description": "쉼표로 구분한 주차 UUID. 생략하면 전체 주차."
          }
        ]
      }
    },
    "/courses/{course_id}/reports/qa": {
      "get": {
        "operationId": "getQAReport",
        "description": "교수 전용. 선택 주차별 질의 내역. 여러 주차 선택은 week_ids로 지정한다.",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
