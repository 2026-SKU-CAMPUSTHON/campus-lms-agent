      "YouTubeOrigin": {
        "type": "object",
        "properties": {
          "video_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{11}$"
          },
          "url": {
            "type": "string",
            "format": "uri",
            "pattern": "^https://www\\.youtube\\.com/watch\\?v=[A-Za-z0-9_-]{11}$"
          },
          "start_sec": {
            "type": "integer",
            "minimum": 0,
            "maximum": 7199
          },
          "end_sec": {
            "type": "integer",
            "minimum": 1,
            "maximum": 7200,
            "nullable": true
          },
          "method": {
            "type": "string",
            "enum": [
              "captions",
              "audio",
              null
            ],
            "nullable": true
          },
          "is_generated": {
            "type": "boolean",
            "nullable": true
          }
        },
        "required": [
          "video_id",
          "url",
          "start_sec",
          "end_sec",
          "method",
          "is_generated"
        ],
        "additionalProperties": false,
        "description": "video 자료의 YouTube 원본. end_sec=null은 영상 끝. method=null은 대기/실패 중일 수 있다. is_generated는 자막 자동 생성 여부이며 음성 전사는 null이다. duration_sec는 원본 전체 길이다."
      },
      "YouTubeImportRequest": {
        "type": "object",
        "properties": {
          "url": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2048,
            "format": "uri"
          },
          "start_sec": {
            "type": "integer",
            "minimum": 0,
            "maximum": 7199
          },
          "end_sec": {
            "type": "integer",
            "minimum": 1,
            "maximum": 7200,
            "nullable": true
          },
          "original_visible_to_students": {
            "type": "boolean"
          }
        },
        "required": [
          "url",
          "original_visible_to_students"
        ],
        "additionalProperties": false,
        "description": "HTTPS youtube.com/watch, shorts/embed, youtu.be 단일 영상만 지원한다. ID/호스트/자격 정보/포트/시간을 서버에서 엄격 검사한다. start_sec 생략 시 링크의 t/start를 사용하며 추적/재생목록 인자는 폐기한다. end_sec 생략/null은 영상 끝. end는 start보다 커야 하며 영상 길이를 넘을 수 없다. 전체 영상 120분 이하만 지원한다."
      },
