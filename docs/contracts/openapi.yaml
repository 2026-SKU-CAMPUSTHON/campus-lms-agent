{
  "openapi": "3.0.3",
  "info": {
    "title": "Campus LMS Agent API",
    "version": "0.1.0-draft.1",
    "description": "구현 전 초안. 계약 고정 작업에서 memberships 관리, Job 결과 참조, 파일 제한, pagination, 통계·재응시 정책을 보완한다. 모든 UUID는 같은 강의 소유권을 검사한다. 실제 배포 주소 없음."
  },
  "servers": [
    {
      "url": "http://localhost:3000/api",
      "description": "예정된 로컬 주소, 서버 미구현"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/courses": {
      "get": {
        "operationId": "listCourses",
        "description": "현재 계정이 속한 강의만 조회한다.",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Course"
                  }
                }
              }
            }
          },
          "default": {
            "description": "권한 오류·계약 오류·처리 오류",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "post": {
        "operationId": "createCourse",
        "description": "",
        "responses": {
          "201": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Course"
                }
              }
            }
          },
          "default": {
            "description": "권한 오류·계약 오류·처리 오류",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "title": {
                    "type": "string",
                    "minLength": 1
                  }
                },
                "required": [
                  "title"
                ],
                "additionalProperties": false
              }
            }
          }
        }
      }
    },
    "/courses/{course_id}/weeks": {
      "get": {
        "operationId": "listWeeks",
        "description": "",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Week"
                  }
                }
              }
            }
          },
          "default": {
            "description": "권한 오류·계약 오류·처리 오류",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "course_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ]
      },
      "post": {
        "operationId": "createWeek",
        "description": "해당 강의 교수 전용.",
        "responses": {
          "201": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Week"
                }
              }
            }
          },
          "default": {
            "description": "권한 오류·계약 오류·처리 오류",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "course_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "week_no": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "title": {
                    "type": "string"
                  }
                },
                "required": [
                  "week_no",
                  "title"
                ],
                "additionalProperties": false
              }
            }
          }
        }
      }
    },
    "/courses/{course_id}/weeks/{week_id}/materials": {
      "post": {
        "operationId": "uploadMaterial",
        "description": "교수 전용. 원본 공개 여부와 AI 처리 허용을 구분한다. PPTX/PDF는 slide 범위를 검사한다. 구형 ppt는 초안 범위 밖이다.",
        "responses": {
          "202": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MaterialReceipt"
                }
              }
            }
          },
          "default": {
            "description": "권한 오류·계약 오류·처리 오류",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "course_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "week_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "file": {
                    "type": "string",
                    "format": "binary"
                  },
                  "source_type": {
                    "type": "string",
                    "enum": [
                      "document",
                      "audio",
                      "video"
                    ]
                  },
                  "original_visible_to_students": {
                    "type": "boolean"
                  },
                  "slide_start": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "slide_end": {
                    "type": "integer",
                    "minimum": 1
                  }
                },
                "required": [
                  "file",
                  "source_type",
                  "original_visible_to_students"
                ],
                "additionalProperties": false
              }
            }
          }
        }
      }
    },
    "/jobs/{job_id}": {
      "get": {
        "operationId": "getJob",
        "description": "해당 강의 교수만 조회한다. Worker 오류는 답변 근거 부족과 별개다.",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Job"
                }
              }
            }
          },
          "default": {
            "description": "권한 오류·계약 오류·처리 오류",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "job_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ]
      }
    },
    "/courses/{course_id}/weeks/{week_id}/quiz-drafts": {
      "post": {
        "operationId": "generateQuizDraft",
        "description": "교수 전용. 등록된 페이지 범위를 분할·배분한다. 완료 Job과 draft_id 연결은 A/C 첫 계약에서 확정한다.",
        "responses": {
          "202": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Job"
                }
              }
            }
          },
          "default": {
            "description": "권한 오류·계약 오류·처리 오류",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "course_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "week_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "material_ids": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "minItems": 1
                  },
                  "question_count": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 50,
                    "default": 50
                  }
                },
                "required": [
                  "material_ids",
                  "question_count"
                ],
                "additionalProperties": false
              }
            }
          }
        }
      }
    },
    "/quiz-drafts/{draft_id}": {
      "get": {
        "operationId": "getQuizDraft",
        "description": "해당 강의 교수만 정답·해설 포함 초안을 조회한다.",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/QuizDraft"
                }
              }
            }
          },
          "default": {
            "description": "권한 오류·계약 오류·처리 오류",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "draft_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ]
      }
    },
    "/quiz-drafts/{draft_id}/publish": {
      "post": {
        "operationId": "publishQuiz",
        "description": "교수 전용. 선택한 문항만 게시한다.",
        "responses": {
          "201": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "quiz_id": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "week_id": {
                      "type": "string",
                      "format": "uuid"
                    }
                  },
                  "required": [
                    "quiz_id",
                    "week_id"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "default": {
            "description": "권한 오류·계약 오류·처리 오류",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "draft_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "question_ids": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "minItems": 1,
                    "uniqueItems": true
                  }
                },
                "required": [
                  "question_ids"
                ],
                "additionalProperties": false
              }
            }
          }
        }
      }
    },
    "/quizzes/{quiz_id}": {
      "get": {
        "operationId": "getPublicQuiz",
        "description": "해당 강의 수강생만 조회한다. 정답과 해설을 반환하지 않는다.",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PublicQuiz"
                }
              }
            }
          },
          "default": {
            "description": "권한 오류·계약 오류·처리 오류",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "quiz_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ]
      }
    },
    "/quizzes/{quiz_id}/attempts": {
      "post": {
        "operationId": "submitAttempt",
        "description": "계정 UUID는 JWT에서 읽는다. 서버가 채점하고 현재 학생의 결과만 반환한다.",
